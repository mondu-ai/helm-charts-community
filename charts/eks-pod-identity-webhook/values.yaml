replicaCount: 3

# How long a stopping replica waits for kube-apiserver to close its keep-alive connections; above its 90s idle timeout.
shutdownDrainTimeout: 100s
# Must cover shutdownDrainTimeout plus the webhook's 5s shutdown.
terminationGracePeriodSeconds: 120

webhook:
  failurePolicy: Ignore
  # Pods in these namespaces are admitted without calling the webhook.
  excludedNamespaces:
    - kube-system

pdb:
  enabled: true
  maxUnavailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

image:
  repository: ghcr.io/mondu-ai/eks-pod-identity-webhook
  tag: "0.3.0"

serviceAccount:
  create: true
  name: eks-pod-identity-webhook-sa


certManager:
  enabled: true
  issuerName: aws-pod-identity-webhook-selfsigned-issuer
  secretName: aws-pod-identity-webhook-tls-secret
  certificate:
    duration: 2160h
    renewBefore: 360h

existingTLSSecret: ""

service:
  port: 443
  annotations: {}

nodeSelector:
  kubernetes.io/arch: arm64

affinity: {}

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  AWS_REGION: us-east-1
  GIN_MODE: release
